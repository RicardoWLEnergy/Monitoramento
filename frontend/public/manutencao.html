<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Em manutenção · W.L Energy</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Página de manutenção (estática: funciona mesmo com o sistema fora do ar).
  Mostrada pelo Caddy quando a API não responde (reinício/atualização) ou no modo manutenção
  (arquivo manutencao/manutencao.ligada no servidor). A cada 15 s confere se o sistema voltou e,
  se voltou, retorna para a tela em que a pessoa estava.
-->
<style>
  :root { --laranja: #ef9600; --cinza: #a7a8a9; --card: #1a1a1a; --linha: rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: #000; color: #fff; font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  .cartao {
    width: 100%; max-width: 460px; display: grid; gap: 18px; padding: 36px 30px;
    background: var(--card); border: 1px solid var(--linha); border-radius: 8px;
  }
  img { height: 36px; width: auto; }
  .rotulo { font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--cinza); }
  h1 { margin: 6px 0 0; font: 700 26px/1.2 "Space Grotesk", "Helvetica Neue", Arial, sans-serif; letter-spacing: -.02em; }
  .filete { width: 40px; height: 2px; background: var(--laranja); }
  p { margin: 0; color: rgba(255,255,255,.78); line-height: 1.6; font-size: 15px; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--cinza); }
  .roda {
    width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.18);
    border-top-color: var(--laranja); animation: girar 1s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .roda { animation: none; } }
  button {
    justify-self: start; padding: 10px 18px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--laranja); color: #000; font: 600 14px "Inter", Arial, sans-serif;
  }
  button:hover { background: #ffab1f; }
  button:focus-visible { outline: 2px solid var(--laranja); outline-offset: 2px; }
</style>
</head>
<body>
  <main class="cartao" role="status" aria-live="polite">
    <img src="/ENERGYWL.png" alt="W.L Energy">
    <div>
      <div class="rotulo">Monitoramento de usinas</div>
      <h1>Estamos atualizando o sistema</h1>
    </div>
    <div class="filete"></div>
    <p>O monitoramento volta em instantes. Os dados das usinas continuam sendo registrados normalmente; nada é perdido.</p>
    <div class="status"><span class="roda" aria-hidden="true"></span><span id="texto">Verificando a cada 15 segundos...</span></div>
    <button type="button" id="tentar">Tentar agora</button>
  </main>
<script>
  (function () {
    // Para onde voltar quando o sistema responder: SÓ endereços deste site (confere a origem;
    // barra dupla, contrabarra, tab ou "javascript:" que apontem para fora voltam para o início)
    function seguro(destino) {
      try {
        var u = new URL(destino, location.origin);
        return u.origin === location.origin ? u.href : '/';
      } catch (e) { return '/'; }
    }
    var voltar = seguro(location.pathname !== '/manutencao.html'
      ? location.pathname + location.search                                   // modo manutenção: a própria página
      : (new URLSearchParams(location.search).get('voltar') || '/'));

    function conferir() {
      document.getElementById('texto').textContent = 'Verificando...';
      fetch('/api/', { cache: 'no-store' }).then(function (r) {
        if ([502, 503, 504].indexOf(r.status) === -1) { location.replace(voltar); return; }
        document.getElementById('texto').textContent = 'Ainda em atualização. Nova verificação em 15 segundos...';
      }).catch(function () {
        document.getElementById('texto').textContent = 'Sem conexão. Nova verificação em 15 segundos...';
      });
    }
    document.getElementById('tentar').addEventListener('click', conferir);
    setInterval(conferir, 15000);
  })();
</script>
</body>
</html>
