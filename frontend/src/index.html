<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Monitoramento · W.L Energy</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Aplica o tema salvo ANTES do CSS para não "piscar" -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wl-tema');
        if (t === 'escuro' || t === 'claro') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
